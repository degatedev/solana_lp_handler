[toolchain]
anchor_version = "0.31.1"
package_manager = "yarn"

[features]
resolution = true
skip-lint = false

[programs.mainnet]
# 这里是主网 program id
lp_handler = "GuRdyEyQ3CRTbU8UJnxbUaRZHdc9s9VgpGF1WJh4NZc5"

[registry]
url = "https://api.apr.dev"

[provider]
# 统一使用生产环境（mainnet）。
# 如需使用自定义 RPC（例如 QuickNode），请通过环境变量覆盖：
# - ANCHOR_PROVIDER_URL=https://<your-mainnet-rpc>
cluster = "mainnet"
wallet = "./wallet/mainnet.json"

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 \"tests/**/*.ts\""
