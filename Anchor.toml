[toolchain]
anchor_version = "0.31.1"
package_manager = "yarn"

[features]
resolution = true
skip-lint = false


[programs.devnet]
lp_handler = "3SuoycRhZARYUxLoxmK9oLeBXtzxtTm2b81nM5VivaFC"

[programs.mainnet]
# 部署到主网后，把这里替换为你在 mainnet 的 programId（通常会和 devnet 不同）
# 注意：这里必须是合法的 base58 Pubkey。先用 System Program 的地址占位，避免 `anchor keys list` 解析失败。
# 注意：这里填的是 **Program Id（程序账户地址）**，不是 ProgramData 地址（Program Executable Data Account）
lp_handler = "CkNvt3vAo9gQ288sKLwdiGL5tcLkGowmLXXjmxYvH6ZT"

[registry]
url = "https://api.apr.dev"

[provider]
# 默认保持 devnet；部署主网时建议用命令行覆盖：
# - anchor deploy --provider.cluster mainnet
# 或者把这里改成 "mainnet"
#cluster = "devnet"
cluster='https://warmhearted-delicate-uranium.solana-mainnet.quiknode.pro/300dfad121b027e64f41fc3b31d342d4b38ed5be'
wallet = "./wallet/mainnet.json"

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 \"tests/**/*.ts\""
